version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: tylaaac-archive-tv_web_1
      APP_PORT: 8080

  web:
    image: alpine/socat:latest
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    command: "TCP-LISTEN:8080,fork,reuseaddr TCP:host.docker.internal:18095"
